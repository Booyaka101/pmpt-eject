name: Feature request
description: Suggest something pmpt-eject should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Pulls your own prompts out of a dashboard and writes them to disk. Prompt text passes through it and is not sent anywhere else.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
